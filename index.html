<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual DOM Example</title>
    <style>
        .app {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .tabs {
            display: flex;
            margin-bottom: 20px;
        }
        .tabs button {
            margin-right: 10px;
            padding: 8px 16px;
            cursor: pointer;
        }
        .tabs button.active {
            background-color: #007BFF;
            color: white;
            border: none;
        }
        .counter, .todo-list {
            padding: 20px;
            border: 1px solid #ddd;
            margin-bottom: 20px;
        }
        .add-todo {
            display: flex;
            margin-bottom: 10px;
        }
        .add-todo input {
            flex: 1;
            padding: 8px;
            margin-right: 10px;
        }
        ul.todos {
            list-style-type: none;
            padding: 0;
        }
        li {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            border-bottom: 1px solid #eee;
        }
        li span {
            cursor: pointer;
        }
        .delete-btn {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 2px 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script src="./src/index.ts"></script>
</body>
</html>
